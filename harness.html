<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <title>Scroll &amp; Stitch Harness</title>
    <script type="module" crossorigin src="/SCROLL_AND_STITCH/assets/harness-DSaDvaDx.js"></script>
    <link rel="modulepreload" crossorigin href="/SCROLL_AND_STITCH/assets/element-BuKW98lC.js">
    <link rel="modulepreload" crossorigin href="/SCROLL_AND_STITCH/assets/seek-source-DBj1FIN_.js">
    <link rel="modulepreload" crossorigin href="/SCROLL_AND_STITCH/assets/webcodecs-zJ7HkTke.js">
    <link rel="modulepreload" crossorigin href="/SCROLL_AND_STITCH/assets/webcodecs-source-ir0Vp6Nf.js">
    <link rel="stylesheet" crossorigin href="/SCROLL_AND_STITCH/assets/harness-DMquivni.css">
    <link rel="stylesheet" crossorigin href="/SCROLL_AND_STITCH/assets/lab-C5tXtkUf.css">
  </head>
  <body>
    <main class="lab">
      <header class="lab-head">
        <p class="eyebrow">Milestone 3 · Test harness</p>
        <h1>Stitching</h1>
        <p class="sub">
          Finds how far the page moved between frames, then builds the long screenshot. Test videos
          are checked against the perfect result. Your video never leaves this phone.
        </p>
      </header>

      <section class="card" aria-labelledby="h-setup">
        <h2 id="h-setup">Set up</h2>
        <div class="field">
          <label for="videoSel">Video</label>
          <select id="videoSel">
            <option value="scroll-demo">Test: scroll and pause</option>
            <option value="scroll-continuous">Test: continuous scroll, no pauses</option>
            <option value="scroll-fast">Test: fast flicks, short pauses</option>
            <option value="scroll-junk">Test: Control Centre, stop prompt and red indicator</option>
            <option value="own">Your own recording…</option>
          </select>
        </div>
        <div class="row" id="ownRow" hidden>
          <label class="btn secondary" for="file">Choose recording</label>
          <input id="file" type="file" accept="video/*" hidden />
          <span class="hint" id="fileName"></span>
        </div>
        <div class="field">
          <label for="readerSel">Frame reader</label>
          <select id="readerSel">
            <option value="auto">Automatic (WebCodecs if available)</option>
            <option value="webcodecs">WebCodecs</option>
            <option value="seek">Video seeking</option>
          </select>
        </div>
        <div class="field">
          <label for="modeSel">Method</label>
          <select id="modeSel">
            <option value="compare">Compare pause-aware and naive</option>
            <option value="pause-aware">Pause-aware only</option>
            <option value="naive">Naive, 8 frames per second</option>
          </select>
        </div>
        <div class="field">
          <label for="formatSel">Image</label>
          <select id="formatSel">
            <option value="png">PNG, full quality</option>
            <option value="jpeg">JPEG, 90% quality</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="keepStatus" /> Keep status bar as recorded (don't hide the red indicator)</label>
        <video id="video" muted playsinline hidden></video>
        <button class="btn" id="run" type="button">Run</button>
        <p class="hint" id="status" role="status"></p>
      </section>

      <div id="runs"></div>

      <div class="report-bar">
        <button class="btn" id="copyReport" type="button">Copy report</button>
        <span id="copyStatus" class="hint" role="status"></span>
      </div>
    </main>
  </body>
</html>
